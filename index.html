<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="game.js"></script>
</head>
<body>
    <div class="container">
        <div class="container-wrapper">
            <button type="button" class="btn-again">play again</button>
            <p>between 1 and 20</p>
        </div>
        <h2>guess my number game</h2>
        <p class="hide-num">?</p>
        <p class="message">start guesing..........</p>

        <div class="number-data">
            <form>
                <input type="number" placeholder="Enter Your Lucky Number!" class="input-number">
                <button type="button" class="btn-again3">check Now!</button>
            </form>

            <div class="content">
                <p>score: <span class="score">20</span></p>
                <p>high score: <span class="high-score">20</span></p>
            </div>
        </div>       
    </div>
</body>
</html>
